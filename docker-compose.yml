services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U shortener -d shortener
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: wraplink:local
    restart: "no"
    command:
      - node
      - dist/src/database/migrate.js
    environment:
      DATABASE_URL: postgresql://shortener:shortener@postgres:5432/shortener
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wraplink:local
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BASE_URL: http://localhost:3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://shortener:shortener@postgres:5432/shortener
      DATABASE_POOL_MAX: 20
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_TTL_SECONDS: 300
      CREATE_RATE_LIMIT_MAX: 20
      CREATE_RATE_LIMIT_WINDOW_SECONDS: 60
      CREATE_API_KEYS: ${CREATE_API_KEYS:?CREATE_API_KEYS must be set in .env}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/ready")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

volumes:
  postgres-data:
  redis-data: