services:
  redis-cluster-1:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "7001"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "no"
    ports:
      - "7001:7001"

  redis-cluster-2:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "7002"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "no"
    ports:
      - "7002:7002"

  redis-cluster-3:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "7003"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "no"
    ports:
      - "7003:7003"

  redis-cluster-init:
    image: redis:7.4-alpine
    restart: "no"
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        until redis-cli -h redis-cluster-1 -p 7001 ping; do sleep 1; done
        until redis-cli -h redis-cluster-2 -p 7002 ping; do sleep 1; done
        until redis-cli -h redis-cluster-3 -p 7003 ping; do sleep 1; done

        redis-cli --cluster create \
          redis-cluster-1:7001 \
          redis-cluster-2:7002 \
          redis-cluster-3:7003 \
          --cluster-replicas 0 \
          --cluster-yes
